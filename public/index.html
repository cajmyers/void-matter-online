<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Void Matter</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: system-ui, sans-serif;
        background: #0a0a0f;
        color: #e8e6f0;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
      }
      main {
        text-align: center;
        padding: 2rem;
      }
      h1 {
        font-weight: 600;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
      canvas {
        display: block;
        margin: 1.5rem auto 0;
        border: 1px solid #2a2a3a;
        border-radius: 8px;
        background: #12121a;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Void Matter</h1>
      <p>Game shell — replace with your build output in <code>public/</code>.</p>
      <canvas id="game" width="480" height="320" aria-label="Game canvas"></canvas>
    </main>
    <script type="module" src="/main.js"></script>
  </body>
</html>
